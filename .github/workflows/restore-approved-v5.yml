name: Restore approved Logo Resizer V5 website
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["React migration checks"]
    types: [completed]
    branches: [main]

concurrency:
  group: forge-restore-approved-v5
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Checkout approved native React V5
        uses: actions/checkout@v4
      - name: Checkout pinned CTK regression oracle (read-only)
        uses: actions/checkout@v4
        with:
          repository: Kotaru27/CTK
          ref: 617615c0b4370c795ddfd6dc4c300920cd595883
          path: legacy-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Build approved native-only React V5
        run: npm run build
        env:
          FORGE_BASE_PATH: /The-Forge/
      - name: Install desktop test browser
        run: npx playwright install chromium --only-shell
      - name: Verify original Logo Resizer and other React tools in Chromium
        run: npm run test:e2e
      - uses: actions/configure-pages@v5
      - id: artifact
        run: echo "name=forge-v5-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: ${{ steps.artifact.outputs.name }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Allow uploaded artifact to be indexed
        run: sleep 20
      - name: Publish verified V5 website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
