name: Publish completed workroom redesign
on:
  workflow_run:
    workflows: ["React migration checks"]
    types: [completed]
    branches: [main]

concurrency:
  group: the-forge-workroom-release
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Checkout The Forge
        uses: actions/checkout@v4
      - name: Checkout pinned CTK parity reference (read-only)
        uses: actions/checkout@v4
        with:
          repository: Kotaru27/CTK
          ref: 617615c0b4370c795ddfd6dc4c300920cd595883
          path: legacy-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit and processing parity tests
        run: npm test
      - name: Build native React website
        run: npm run build
        env:
          FORGE_BASE_PATH: /The-Forge/
      - name: Install desktop Chromium
        run: npx playwright install chromium --only-shell
      - name: Full desktop browser regression
        run: npm run test:e2e
      - name: Retain workroom screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-workroom-release-qa-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/configure-pages@v5
      - id: artifact
        run: echo "name=forge-workroom-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: ${{ steps.artifact.outputs.name }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}

  smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install chromium --only-shell
      - name: Test the actual published Home and seven tools
        run: node scripts/smoke-live-pages.mjs
        env:
          FORGE_LIVE_URL: ${{ needs.deploy.outputs.page_url }}
