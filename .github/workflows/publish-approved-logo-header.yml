name: One-time approved Logo Resizer single-header Pages publish
on:
  push:
    branches: [release/pages-preview]

# Trigger only the explicitly approved single-header release merge, then remove this helper.
# The existing manual Pages workflow keeps all tests, deployment permissions and smoke checks.
permissions:
  contents: read
  actions: write

jobs:
  dispatch-approved-preview:
    if: contains(github.event.head_commit.message, '[publish-logo-header]')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing gated GitHub Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref release/pages-preview
