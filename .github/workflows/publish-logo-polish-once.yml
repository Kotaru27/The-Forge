name: One-time approved Logo Resizer polish Pages publish
on:
  push:
    branches: [release/pages-preview]

# Dispatch only the verified and explicitly approved polish merge.
# Remove after the existing gated Pages workflow finishes successfully.
permissions:
  contents: read
  actions: write

jobs:
  dispatch-approved-preview:
    if: contains(github.event.head_commit.message, '[publish-logo-polish]')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing gated GitHub Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref release/pages-preview
