name: One-time approved Logo Resizer V5 Pages publish
on:
  push:
    branches: [release/pages-preview]

# Trigger only the explicitly approved V5 release merge, then remove this helper.
# The existing manual Pages workflow retains all checks, deployment permissions and smoke tests.
permissions:
  contents: read
  actions: write

jobs:
  dispatch-approved-preview:
    if: contains(github.event.head_commit.message, '[publish-logo-v5]')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing gated manual GitHub Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref release/pages-preview
