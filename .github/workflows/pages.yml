name: Publish web preview
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["React migration checks"]
    types: [completed]
    branches: [main]

# Serialize Pages deployments so rapid UI commits never collide.
concurrency:
  group: forge-pages-preview
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kotaru27/CTK
          ref: 617615c0b4370c795ddfd6dc4c300920cd595883
          path: legacy-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run prepare:legacy
        env:
          CTK_SOURCE_DIR: legacy-source
      - run: npm test
        env:
          CTK_SOURCE_DIR: legacy-source
      - run: npm run build
        env:
          CTK_SOURCE_DIR: legacy-source
          FORGE_BASE_PATH: /The-Forge/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: forge-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: forge-pages-${{ github.run_id }}-${{ github.run_attempt }}
