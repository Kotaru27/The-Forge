name: Ink Atelier isolated preview via approved release branch

on:
  push:
    branches:
      - release/pages-preview
  workflow_dispatch:

# IMPORTANT: This deploys BOTH unchanged main and the design candidate.
# It does not deploy the candidate over the production root.
permissions:
  contents: read

concurrency:
  group: ink-atelier-approved-release-pages-preview
  cancel-in-progress: false

jobs:
  verify-and-assemble:
    name: Test candidate and package separate Pages root
    runs-on: ubuntu-latest
    steps:
      - name: Checkout unmodified production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-source
          persist-credentials: false
      - name: Checkout isolated Ink Atelier branch
        uses: actions/checkout@v4
        with:
          ref: design/ink-atelier-preview-20261115
          path: candidate
          persist-credentials: false
      - name: Checkout pinned CTK regression oracle for candidate tests
        uses: actions/checkout@v4
        with:
          repository: Kotaru27/CTK
          ref: 617615c0b4370c795ddfd6dc4c300920cd595883
          path: candidate/legacy-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install candidate dependencies
        working-directory: candidate
        run: npm install --no-audit --no-fund
      - name: Test native tools and pinned CTK behavior
        working-directory: candidate
        run: npm test
      - name: Build candidate for full Chromium regression suite
        working-directory: candidate
        run: npm run build
        env:
          FORGE_BASE_PATH: /The-Forge/
      - name: Install Chromium
        working-directory: candidate
        run: npx playwright install --with-deps chromium
      - name: Run complete browser regression suite, including Ink Atelier
        working-directory: candidate
        run: npm run test:e2e
      - name: Save preview UI review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ink-atelier-browser-review-${{ github.run_id }}
          path: candidate/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Rebuild candidate for its isolated Pages subpath
        working-directory: candidate
        run: npm run build
        env:
          FORGE_BASE_PATH: /The-Forge/ink-atelier-preview/

      - name: Build production from unchanged main
        working-directory: main-source
        run: |
          npm install --no-audit --no-fund
          npm run build
        env:
          FORGE_BASE_PATH: /The-Forge/

      - name: Assemble root = main, subpath = candidate
        run: |
          mkdir -p combined-site/ink-atelier-preview
          cp -a main-source/dist/. combined-site/
          cp -a candidate/dist/. combined-site/ink-atelier-preview/
          test -s combined-site/index.html
          test -s combined-site/ink-atelier-preview/index.html
          diff -qr main-source/dist combined-site --exclude ink-atelier-preview
          grep -q '/The-Forge/assets/' combined-site/index.html
          grep -q '/The-Forge/ink-atelier-preview/assets/' combined-site/ink-atelier-preview/index.html
          echo 'PRODUCTION ROOT VERIFIED BYTE-FOR-BYTE IDENTICAL TO FRESH main BUILD'

      - name: Upload safe combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: combined-site

  deploy:
    name: Publish root plus isolated Ink Atelier preview
    needs: verify-and-assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}ink-atelier-preview/
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish verified combined build
        id: publish
        uses: actions/deploy-pages@v4

  smoke:
    name: Verify live main and Ink Atelier URLs
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/ink-atelier-preview-20261115
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Smoke test both live sites in Chromium
        run: node scripts/smoke-ink-atelier-pages.mjs
      - name: Upload live comparison screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ink-atelier-live-pages-${{ github.run_id }}
          path: |
            production-home-smoke.png
            ink-atelier-home-smoke.png
          if-no-files-found: ignore
          retention-days: 14
