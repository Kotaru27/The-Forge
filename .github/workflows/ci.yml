name: React migration checks
on:
  push:
    branches: [main, 'migration/**', 'release/pages-preview']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout The Forge
        uses: actions/checkout@v4
      - name: Checkout pinned CTK logic (read-only)
        uses: actions/checkout@v4
        with:
          repository: Kotaru27/CTK
          ref: 617615c0b4370c795ddfd6dc4c300920cd595883
          path: legacy-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          CTK_SOURCE_DIR: legacy-source
          FORGE_BASE_PATH: /The-Forge/

  browser:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/migration/') || github.ref == 'refs/heads/release/pages-preview'
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          FORGE_BASE_PATH: /The-Forge/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Archive desktop workroom screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-workroom-qa-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      # Produce a downloadable candidate even before GitHub Pages is enabled.
      # This artifact is for staging/review; it does not publish the website.
      - name: Archive reviewed production build
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/pages-preview'
        uses: actions/upload-artifact@v4
        with:
          name: the-forge-pages-preview
          path: dist
          if-no-files-found: error
          retention-days: 7
