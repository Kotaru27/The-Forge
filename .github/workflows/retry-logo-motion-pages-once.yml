name: One-time retry of verified Logo Resizer Pages release
on:
  push:
    branches: [release/pages-preview]

# Short-lived helper only. The existing manual Pages workflow still owns the
# build, regression tests, deployment and live-site smoke test.
permissions:
  contents: read
  actions: write

jobs:
  dispatch-release:
    if: contains(github.event.head_commit.message, '[retry-logo-motion-pages]')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing manual gated workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref release/pages-preview
