name: Publish The Forge Studio preview
on:
  push:
    branches:
      - release/studio-pages-20261110

permissions:
  contents: read

concurrency:
  group: forge-studio-pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source, tests, build and browser flows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed Studio preview
        uses: actions/checkout@v4
      - name: Prepare pinned migration regression baseline (test only)
        uses: actions/checkout@v4
        with:
          repository: Kotaru27/CTK
          ref: 617615c0b4370c795ddfd6dc4c300920cd595883
          path: legacy-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          FORGE_BASE_PATH: /The-Forge/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload verified Pages bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish studio preview to Pages
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      site_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish verified site
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Check real live URL and browser download
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify live Pages toolset
        env:
          FORGE_LIVE_URL: ${{ needs.deploy.outputs.site_url }}
        run: node scripts/smoke-live-pages.mjs
