name: One-time verified Logo Resizer sidebar release
on:
  push:
    branches: [release/pages-preview]
permissions:
  contents: read
  actions: write
jobs:
  launch-gated-pages:
    if: contains(github.event.head_commit.message, '[publish-logo-v71]')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing gated Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref release/pages-preview
